name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://user:password@localhost:5432/user_api_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: user_api_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U user -d user_api_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run database migrations
        run: docker run --rm --network host -v "$GITHUB_WORKSPACE/migrations:/migrations:ro" migrate/migrate:v4.19.1 -path=/migrations -database "$TEST_DATABASE_URL" up
      - name: Run tests
        run: go test ./... -count=1